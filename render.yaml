services:
  - type: web
    name: story-cocreate-backend
    runtime: python
    rootDir: story-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: career-simulator-backend
    runtime: python
    rootDir: 职业体验模拟器
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: TEACHER_REVIEW_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
