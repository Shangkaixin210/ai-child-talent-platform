  <div class="brand"><div class="brand-logo">🐬</div><div><b>蔚蓝深海基地</b><small>移动端响应式设计演示</small></div></div>
  <div class="controls">
    <div class="control-group" id="devices"><button class="tab active" data-device="phone">📱 手机</button><button class="tab" data-device="tablet">▣ 平板</button></div>
    <div class="control-group" id="orientations"><button class="tab active" data-orientation="portrait">↕ 竖屏</button><button class="tab" data-orientation="landscape">↔ 横屏</button></div>
  </div>
</header>
<main class="workspace">
  <div class="device phone portrait" id="device">
    <div class="screen">
      <div class="rays"></div>
      <header class="hud"><div class="avatar">🐬</div><div class="guide"><div><b>沫沫 · 基地 AI</b><span class="online">● ONLINE</span></div><div class="msg">把海洋生物送回合适的新家，修复珊瑚公寓吧！</div></div><span class="timer">⏱ 02:18</span></header>
      <main class="game"><div class="page" id="page"></div></main>
      <nav class="bottom-nav" id="pageNav">
        <button class="nav active" data-page="start"><i>🏠</i><span>基地封面</span></button>
        <button class="nav" data-page="level1"><i>🐠</i><span>珊瑚公寓</span></button>
        <button class="nav" data-page="level2"><i>⚡</i><span>洋流电网</span></button>
        <button class="nav" data-page="level3"><i>🤝</i><span>议事厅</span></button>
        <button class="nav" data-page="ending"><i>🏅</i><span>授勋</span></button>
        <button class="nav" data-page="report"><i>📊</i><span>天赋报告</span></button>
      </nav>
      <div class="toast" id="toast">配对正确</div>
    </div>
  </div>
</main>
<div class="note">点击顶部按钮，查看 4 种独立响应式布局</div>
<script>
const device=document.querySelector('#device'),toast=document.querySelector('#toast'),page=document.querySelector('#page'),msg=document.querySelector('.msg');
function activate(group,target,key){document.querySelectorAll(`#${group} .tab`).forEach(x=>x.classList.remove('active'));target.classList.add('active');device.classList.remove(key==='device'?'phone':'portrait',key==='device'?'tablet':'landscape');device.classList.add(target.dataset[key])}
document.querySelector('#devices').addEventListener('click',e=>{const b=e.target.closest('[data-device]');if(b)activate('devices',b,'device')});
document.querySelector('#orientations').addEventListener('click',e=>{const b=e.target.closest('[data-orientation]');if(b)activate('orientations',b,'orientation')});
function say(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
const pages={
start:{msg:'欢迎小队长！风暴摧毁了基地，带领伙伴们让家园重新发光吧！',html:()=>`<div class="cover"><section class="cover-main panel"><span class="chip">● 深海基地紧急呼叫</span><div class="hero-row"><div class="hero-momo">🐬</div><div><div class="sub">沫沫 AI 邀请你加入</div><h1>蔚蓝深海基地</h1><div class="signal">BLUE OCEAN BASE · REBUILD MISSION</div></div></div><div class="story">风暴摧毁了海底家园，珊瑚公寓、电力管网和海洋议事厅都在等待修复。小队长，带领伙伴们让基地重新发光吧！</div><div class="form"><div class="field"><label>你的名字</label><input value="小队长" aria-label="你的名字"></div><div class="field"><label>你的年龄</label><div class="ages">${[6,7,8,9,10].map(x=>`<button class="age ${x===8?'active':''}">${x}岁</button>`).join('')}</div></div></div><button class="cta next">开始深海任务 →</button></section><aside class="route panel"><h2>基地修复路线</h2><div class="route-list">${[['🐠','珊瑚公寓','观察共生关系，安顿海洋伙伴'],['⚡','洋流电网','规划管线路径，重启基地能源'],['🤝','海洋议事厅','理解伙伴情绪，完成公平调解']].map((x,i)=>`<div class="route-item"><div class="route-icon">${x[0]}</div><div><b>${x[1]}</b><span>${x[2]}</span></div><span>0${i+1}</span></div>`).join('')}</div></aside></div>`},
level1:{msg:'第一关 · 珊瑚公寓：观察共生关系，把海洋生物安顿到正确位置。',html:()=>`<div class="level"><aside class="brief panel"><span class="chip">MISSION 01</span><h2>珊瑚公寓</h2><p class="sub">观察海洋生物之间的共生关系。先选择生物，再把它安置到合适的家。</p><button class="cta next">完成本关 →</button></aside><section class="playfield panel"><div class="play-head"><b>🐠 生物安置区</b><span class="score">已配对 3 / 4</span></div><div class="habitats"><div class="habitat"><i>🪸</i><div><b>海葵之家</b><small>小丑鱼躲避天敌</small></div></div><div class="habitat"><i>🪨</i><div><b>清洁工作站</b><small>清洁虾帮助大鱼</small></div></div><div class="habitat"><i>🌿</i><div><b>海草浅湾</b><small>海龟的食物家园</small></div></div><div class="habitat"><i>🏝️</i><div><b>沙地洞穴</b><small>虾虎鱼与枪虾共居</small></div></div></div><div class="tray">${['🐠','🦐','🐢','🐟'].map((x,i)=>`<button class="creature ${i===0?'active':''}">${x}</button>`).join('')}</div></section></div>`},
level2:{msg:'第二关 · 洋流电网：铺设管道绕开磁石，连通基地能源。',html:()=>`<div class="level"><aside class="brief panel"><span class="chip">MISSION 02</span><h2>洋流电网</h2><p class="sub">从左侧发电机出发，旋转并铺设管道，绕开磁石，把能量送到水晶接收器。</p><button class="cta next">接通能源 →</button></aside><section class="playfield panel"><div class="play-head"><b>⚡ 能源管网</b><span class="score">管道 12 · 旋转 4</span></div><div class="grid-board">${Array.from({length:35},(_,i)=>{let c='cell',v='·';if(i===14){c+=' power';v='⚙️'}else if(i===20){c+=' goal';v='💎'}else if([10,11,17,24].includes(i)){c+=' rock';v='🪨'}else if([15,16,18,19,26,27].includes(i))v=['━','┓','┃','┗'][i%4];return`<div class="${c}">${v}</div>`}).join('')}</div><div class="pipebar"><button class="pipe">━</button><button class="pipe">┃</button><button class="pipe">┏</button><button class="pipe">┗</button></div></section></div>`},
level3:{msg:'第三关 · 海洋议事厅：倾听壳壳和彩彩，帮助它们达成公平方案。',html:()=>`<div class="talk"><aside class="characters panel"><span class="chip">MISSION 03</span><h2 class="page-title">海洋议事厅</h2><div class="faces"><div class="face"><i>🦀</i><b class="emotion">壳壳 · 委屈</b></div><div class="face"><i>🐠</i><b class="emotion">彩彩 · 生气</b></div></div><div class="harmony">💚 和解度 72%</div><div class="bar"><i style="width:72%"></i></div></aside><section class="dialogue panel"><div class="play-head"><b>💬 调解对话 · 第 2/3 轮</b><span class="score">先倾听，再表达</span></div><div class="chat"><div class="bubble-chat keke">🦀 我想安静看书，可彩彩总是在旁边跳舞……</div><div class="bubble-chat caicai">🐠 我也需要练舞的地方，为什么总让我让步？</div><div class="bubble-chat player">🧒 我听见壳壳需要安静，彩彩需要练习空间。</div></div><div class="choices"><button class="choice">上午安静阅读，下午开放练舞</button><button class="choice">划分安静区和表演区</button><button class="choice">戴耳机并提前约定时间</button><button class="choice next">确认双赢方案 →</button></div></section></div>`},
ending:{msg:'太棒了！三项修复任务全部完成，授予你深海基地守护者勋章！',html:()=>`<div class="ending"><section class="ceremony panel"><span class="chip">MISSION COMPLETE</span><div class="medal">🏅</div><h1>深海基地守护者</h1><p>小队长，你用观察、规划和沟通帮助伙伴们重建了家园。蔚蓝深海基地再次闪耀！</p><div class="awards"><div class="award">🐠 生态观察</div><div class="award">⚡ 逻辑规划</div><div class="award">🤝 共情调解</div></div><button class="cta next">查看我的天赋报告 →</button></section></div>`},
report:{msg:'这是你在本次深海任务中的多元智能发展报告。',html:()=>`<div class="report"><header class="report-top panel"><div><h2>小队长的多元智能报告</h2><span class="sub">基于三项游戏任务的过程性观察</span></div><div><span class="grade">8.2</span><span class="chip">发展潜能</span></div></header><div class="report-body"><section class="radar panel"><div class="radar-shape"></div><p class="sub">你的突出优势是自然观察、人际社交和语言表达。遇到空间规划任务时，也能通过尝试逐步找到规律。</p></section><section class="dimensions panel"><div class="play-head"><b>六维能力画像</b><span class="score">同龄参考 · 8岁</span></div><div class="dim-list">${[['🏗️ 空间视觉',76],['🧮 逻辑数理',82],['🌿 自然观察',91],['🤝 人际社交',94],['💬 语言表达',88],['🧠 专注执行',79]].map(x=>`<div class="dim"><div class="dim-head"><span>${x[0]}</span><b>${x[1]/10}</b></div><div class="mini-bar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div><p class="sub">培养建议：继续通过拼图、搭建和路线规划练习空间思维；在家庭讨论中鼓励孩子先复述他人需求，再提出自己的解决办法。</p></section></div></div>`}
};
const order=['start','level1','level2','level3','ending','report'];let current='start';
function show(id){current=id;page.innerHTML=pages[id].html();msg.textContent=pages[id].msg;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}
document.querySelector('#pageNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)show(b.dataset.page)});
page.addEventListener('click',e=>{if(e.target.closest('.next')){const i=order.indexOf(current);if(i<order.length-1)show(order[i+1])}const a=e.target.closest('.age');if(a){page.querySelectorAll('.age').forEach(x=>x.classList.remove('active'));a.classList.add('active')}const c=e.target.closest('.creature');if(c){page.querySelectorAll('.creature').forEach(x=>x.classList.remove('active'));c.classList.add('active');say('已选择海洋伙伴')}});
show('start');
</script>
</body>
</html>
